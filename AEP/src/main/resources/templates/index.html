<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - ObservaAção</title>
    <!-- Importando o Bootstrap 5 e Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { height: 100vh; background-color: #ffffff; border-right: 1px solid #dee2e6; padding-top: 20px; }
        .nav-link { color: #495057; font-weight: 500; margin-bottom: 5px; border-radius: 5px; }
        .nav-link:hover, .nav-link.active { background-color: #e9ecef; color: #0d6efd; }
        .topbar { background-color: #ffffff; border-bottom: 1px solid #dee2e6; padding: 15px 20px; }
        .card-metric { border: 2px solid #dee2e6; border-radius: 10px; }
        .status-badge { font-size: 0.85em; padding: 5px 10px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Menu Lateral (Sidebar) -->
        <nav class="col-md-2 d-none d-md-block sidebar">
            <div class="text-center mb-4">
                <h4 class="text-primary fw-bold"><i class="bi bi-eye"></i> ObservaAção</h4>
            </div>
            <ul class="nav flex-column px-2">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/solicitacoes}">
                        <i class="bi bi-grid-1x2 me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/solicitacoes/nova}">
                        <i class="bi bi-plus-circle me-2"></i> Nova denúncia
                    </a>
                </li>
                <li class="nav-item mt-5">
                    <a class="nav-link text-danger" th:href="@{/logout}">
                        <i class="bi bi-box-arrow-right me-2"></i> Sair
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Conteúdo Principal -->
        <main class="col-md-10 ms-sm-auto px-0">
            <!-- Barra Superior (Topbar) -->
            <div class="topbar d-flex justify-content-between align-items-center">
                <div class="input-group w-50">
                    <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control border-start-0" placeholder="Buscar Denúncias...">
                </div>
                <div class="user-profile text-end">
                    <span class="fw-bold d-block">Usuário Logado</span>
                    <small class="text-muted">Perfil de Acesso</small>
                </div>
            </div>

            <!-- Área de Conteúdo -->
            <div class="p-4">

                <!-- Cards de Métricas -->
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card card-metric p-3 text-center">
                            <h6 class="text-muted">Não iniciada / Aberta</h6>
                            <h2 class="fw-bold" th:text="${qtdAbertas}">0</h2>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card card-metric p-3 text-center">
                            <h6 class="text-muted">Em andamento</h6>
                            <h2 class="fw-bold text-warning" th:text="${qtdEmAndamento}">0</h2>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card card-metric p-3 text-center">
                            <h6 class="text-muted">Resolvido</h6>
                            <h2 class="fw-bold text-success" th:text="${qtdResolvidas}">0</h2>
                        </div>
                    </div>
                </div>

                <!-- Tabela de Denúncias -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Status</th>
                                <th>Prioridade</th>
                                <th>Endereço / Rua</th>
                                <th>Previsão</th>
                                <th class="text-end pe-4">Ações</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="s : ${listaSolicitacoes}">
                                <td class="ps-4 fw-bold text-muted" th:text="'#' + ${s.protocolo}"></td>
                                <td>
                                    <span class="badge rounded-pill bg-secondary" th:if="${s.statusAtual.name() == 'ABERTO'}">Aberta</span>
                                    <span class="badge rounded-pill bg-warning text-dark" th:if="${s.statusAtual.name() == 'EM_EXECUCAO'}">Em Andamento</span>
                                    <span class="badge rounded-pill bg-success" th:if="${s.statusAtual.name() == 'RESOLVIDO'}">Resolvido</span>
                                </td>
                                <td th:text="${s.prioridade}"></td>
                                <td th:text="${s.rua}"></td>
                                <td th:text="${#temporals.format(s.previsaoConclusao, 'dd/MM/yyyy')}"></td>
                                <td class="text-end pe-4">
                                    <button class="btn btn-sm btn-outline-primary me-1" title="Ver detalhes"><i class="bi bi-search"></i></button>
                                    <a th:href="@{/solicitacoes/deletar/{id}(id=${s.protocolo})}" class="btn btn-sm btn-outline-danger" title="Excluir"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(listaSolicitacoes)}">
                                <td colspan="6" class="text-center py-4 text-muted">Nenhuma denúncia cadastrada.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
