<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova Denúncia - ObservaAção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { height: 100vh; background-color: #ffffff; border-right: 1px solid #dee2e6; padding-top: 20px; }
        .nav-link { color: #495057; font-weight: 500; margin-bottom: 5px; border-radius: 5px; }
        .nav-link:hover, .nav-link.active { background-color: #e9ecef; color: #0d6efd; }
        .topbar { background-color: #ffffff; border-bottom: 1px solid #dee2e6; padding: 15px 20px; }
        .form-card { background: white; border-radius: 10px; border: 1px solid #dee2e6; padding: 30px; }
        .photo-upload { border: 2px dashed #adb5bd; border-radius: 10px; padding: 30px; text-align: center; color: #6c757d; cursor: pointer; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Menu Lateral (Sidebar) -->
        <nav class="col-md-2 d-none d-md-block sidebar">
            <div class="text-center mb-4">
                <h4 class="text-primary fw-bold"><i class="bi bi-eye"></i> ObservaAção</h4>
            </div>
            <ul class="nav flex-column px-2">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/solicitacoes}">
                        <i class="bi bi-grid-1x2 me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/solicitacoes/nova}">
                        <i class="bi bi-plus-circle me-2"></i> Nova denúncia
                    </a>
                </li>
                <li class="nav-item mt-5">
                    <a class="nav-link text-danger" th:href="@{/logout}">
                        <i class="bi bi-box-arrow-right me-2"></i> Sair
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Conteúdo Principal -->
        <main class="col-md-10 ms-sm-auto px-0">
            <!-- Barra Superior -->
            <div class="topbar d-flex justify-content-between align-items-center">
                <div class="input-group w-50">
                    <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control border-start-0" placeholder="Buscar...">
                </div>
                <div class="user-profile text-end">
                    <span class="fw-bold d-block" th:text="${nomeUsuario}">Usuário Logado</span>
                </div>
            </div>

            <!-- Formulário -->
            <div class="p-4">
                <h3 class="mb-1"><a th:href="@{/solicitacoes}" class="text-dark text-decoration-none"><i class="bi bi-arrow-left me-2"></i></a> Nova denúncia</h3>
                <p class="text-muted mb-4">Preencha os dados abaixo para realizar sua denúncia.</p>

                <!-- Alerta de Erro -->
                <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                <div class="form-card shadow-sm">
                    <form th:action="@{/solicitacoes/salvar}" th:object="${solicitacao}" method="post">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Tipo de problema / Categoria *</label>
                                <select class="form-select" th:field="*{categoria}" required>
                                    <option value="" selected>Selecione a categoria</option>
                                    <option value="Infraestrutura - Vias Públicas">Infraestrutura > Vias públicas</option>
                                    <option value="Iluminação Pública">Iluminação Pública</option>

                                    <option value="Outros">Outros</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Endereço *</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" th:field="*{rua}" placeholder="Digite o endereço ou localização" required>
                                    <button class="btn btn-outline-secondary" type="button"><i class="bi bi-geo-alt"></i> Usar localização</button>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Descrição *</label>
                            <textarea class="form-control" th:field="*{descricao}" rows="4" placeholder="Descreva o problema com o máximo de detalhes possível..." required></textarea>
                            <div class="text-end text-muted small mt-1">Mínimo de 10 caracteres</div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold d-block">Fotos (opcional)</label>
                                <div class="photo-upload">
                                    <i class="bi bi-camera fs-2"></i>
                                    <p class="mb-0 mt-2 fw-bold">Adicionar fotos</p>
                                    <small>ou arraste arquivos aqui<br>Máx. 5 fotos (10MB cada)</small>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold d-block">Nível de prioridade *</label>
                                <div class="btn-group w-100" role="group">
                                    <input type="radio" class="btn-check" name="prioridade" id="prioBaixa" value="Baixa" th:field="*{prioridade}" required>
                                    <label class="btn btn-outline-secondary" for="prioBaixa">Baixa</label>

                                    <input type="radio" class="btn-check" name="prioridade" id="prioMedia" value="Média" th:field="*{prioridade}">
                                    <label class="btn btn-outline-secondary" for="prioMedia">Média</label>

                                    <input type="radio" class="btn-check" name="prioridade" id="prioAlta" value="Alta" th:field="*{prioridade}">
                                    <label class="btn btn-outline-secondary" for="prioAlta">Alta</label>
                                </div>
                            </div>
                        </div>

                        <!-- Switch de Denúncia Anônima -->
                        <div class="form-check form-switch mb-4 bg-light p-3 rounded border">
                            <input class="form-check-input ms-0 me-2" type="checkbox" role="switch" id="anonimoCheck" th:field="*{anonimo}">
                            <label class="form-check-label fw-bold text-dark" for="anonimoCheck">
                                Quero fazer esta denúncia de forma anônima
                            </label>
                            <small class="d-block text-muted ms-5">Seus dados não aparecerão no histórico público da denúncia.</small>
                        </div>

                        <div class="d-flex justify-content-between pt-3 border-top">
                            <a th:href="@{/solicitacoes}" class="btn btn-outline-secondary px-4">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-5">Enviar denúncia</button>
                        </div>

                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
